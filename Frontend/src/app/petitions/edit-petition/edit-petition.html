<div class="edit-petition-page">

    <div class="edit-card">

        <div class="page-header">
            <div>
                <h1>Edit Petition</h1>
                <p>Update the details of your petition.</p>
            </div>

            <button type="button" class="back-btn" (click)="cancel()" [disabled]="saving">
                ← Back
            </button>
        </div>

        <div *ngIf="loading" class="loading">
            Loading petition...
        </div>

        <form *ngIf="!loading" (ngSubmit)="onSubmit()">

            <!-- Title -->
            <label>
                Title

                <input type="text" [(ngModel)]="title" name="title" maxlength="200"
                    placeholder="Enter petition title" />
            </label>

            <!-- Description -->
            <label>
                Description

                <textarea [(ngModel)]="description" name="description" rows="6"
                    placeholder="Describe your petition..."></textarea>
            </label>

            <!-- Category -->
            <label>
                Category

                <select [(ngModel)]="category" name="category">
                    <option value="" disabled>
                        Select category
                    </option>

                    <option *ngFor="let c of categories" [value]="c">
                        {{ c }}
                    </option>
                </select>
            </label>

            <!-- Location -->
            <label>
                Location

                <input type="text" [(ngModel)]="location" name="location" placeholder="e.g. San Diego, CA" />
            </label>

            <!-- Signature Limit -->
            <label>
                Signature Limit

                <select [(ngModel)]="signatureLimit" name="signatureLimit">
                    <option *ngFor="let limit of signatureLimits" [ngValue]="limit">
                        {{ limit }} signatures
                    </option>
                </select>

                <small class="helper-text">
                    Choose the target number of signatures for this petition.
                </small>
            </label>

            <!-- Status -->
            <label>
                Status

                <select [(ngModel)]="status" name="status">
                    <option value="active">
                        Active
                    </option>

                    <option value="under_review">
                        Under Review
                    </option>

                    <option value="closed">
                        Closed
                    </option>
                </select>
            </label>

            <!-- Error -->
            <p *ngIf="errorMessage" class="error">
                {{ errorMessage }}
            </p>

            <!-- Actions -->
            <div class="form-actions">

                <button type="button" class="cancel-btn" (click)="cancel()" [disabled]="saving">
                    Cancel
                </button>

                <button type="submit" class="save-btn" [disabled]="saving">
                    {{ saving ? 'Saving...' : 'Save Changes' }}
                </button>

            </div>

        </form>

    </div>

</div>
