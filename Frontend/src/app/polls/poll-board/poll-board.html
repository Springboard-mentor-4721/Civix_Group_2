<section class="poll-board-page">
    <button class="back-btn" type="button" (click)="goDashboard()">← Back to Dashboard</button>

    <div class="page-header">
        <div>
            <p class="eyebrow">CIVIX COMMUNITY</p>
            <h1>Public Polls</h1>
        </div>

        <button class="primary-btn" type="button" (click)="goCreate()">
            + Create Poll
        </button>
    </div>

    <div class="controls">
        <div class="search-box">
            <span>⌕</span>
            <input type="text" [(ngModel)]="search" placeholder="Search polls or locations..." />
        </div>
        <button class="ghost-btn" type="button" (click)="loadPolls()">Refresh</button>
    </div>

    <div *ngIf="error" class="error-box">{{ error }}</div>

    <div *ngIf="loading" class="loading-box">Loading polls...</div>

    <div *ngIf="!loading && !filteredPolls().length" class="empty-box">
        <h3>No polls yet</h3>
        <p>Be the first to create a community poll in your area.</p>
    </div>

    <div class="poll-grid" *ngIf="!loading">
        <article class="poll-card" *ngFor="let poll of filteredPolls()" (click)="openPoll(poll.id)">
            <div class="poll-badge">LIVE</div>
            <h3>{{ poll.title }}</h3>
            <div class="meta-row">
                <span>📍 {{ poll.target_location }}</span>
                <span>👥 {{ poll.totalVotes }} votes</span>
            </div>

            <ul class="option-list">
                <li *ngFor="let option of poll.options.slice(0, 3)">{{ option }}</li>
            </ul>

            <div class="poll-footer">
                <span *ngIf="poll.userVoted" class="voted-pill">You voted</span>
                <span class="view-link">View results →</span>
            </div>
        </article>
    </div>
</section>
