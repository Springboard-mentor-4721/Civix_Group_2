<section class="create-poll-page">
    <div class="form-shell">
        <div class="page-topbar">
            <button class="back-btn" type="button" (click)="goBack()">← Back</button>
        </div>

        <div class="header-copy">
            <p class="eyebrow">CREATE COMMUNITY POLL</p>
            <h1>Start a local conversation</h1>
        </div>

        <form (ngSubmit)="submit()" class="poll-form">
            <label>
                <span>Poll title</span>
                <input type="text" [(ngModel)]="title" name="title" placeholder="What should the community vote on?" />
            </label>

            <label>
                <span>Target location</span>
                <input type="text" [(ngModel)]="targetLocation" name="targetLocation"
                    placeholder="e.g. Mumbai, India" />
            </label>

            <div class="options-wrap">
                <span class="label">Poll options</span>

                <div class="option-row" *ngFor="let option of options; let i = index; trackBy: trackByIndex">
                    <input type="text" [(ngModel)]="options[i]" [name]="'option-' + i"
                        [placeholder]="'Option ' + (i + 1)" />
                    <button type="button" class="remove-btn" *ngIf="options.length > 2"
                        (click)="removeOption(i)">Remove</button>
                </div>

                <button type="button" class="add-btn" (click)="addOption()" *ngIf="options.length < 10">+ Add
                    option</button>
            </div>

            <div *ngIf="error" class="error-box">{{ error }}</div>

            <button class="submit-btn" type="submit" [disabled]="loading">
                {{ loading ? 'Creating poll...' : 'Create Poll' }}
            </button>
        </form>
    </div>
</section>
